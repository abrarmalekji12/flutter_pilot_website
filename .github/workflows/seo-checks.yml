name: SEO checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: seo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    name: Build, prerender and verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build and prerender
        run: npm run build

      - name: Check built HTML, sitemap, links and structured data
        run: npm run test:seo

      - name: Check HTTP behavior with the Cloudflare Pages asset server
        run: npm run test:seo:pages

      - name: Check for Cloudflare credentials
        id: cloudflare
        if: github.event_name == 'pull_request' && github.head_ref != 'main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not available to this run; skipping the preview deployment checks."
          fi

      # Preview deployments live on *.pages.dev, which _headers marks noindex.
      - name: Deploy Cloudflare Pages preview
        id: preview
        if: steps.cloudflare.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.head_ref }}

      - name: Check the deployed preview
        if: steps.cloudflare.outputs.available == 'true'
        run: npm run test:seo:deployed -- "${{ steps.preview.outputs.deployment-url }}"
