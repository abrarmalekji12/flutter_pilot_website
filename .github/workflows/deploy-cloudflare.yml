name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build website
        run: npm run build

      - name: Check SEO output
        run: |
          npm run test:seo
          npm run test:seo:pages

      - name: Verify Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as repository secrets, and CLOUDFLARE_PAGES_PROJECT_NAME as a repository variable."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Checks this deployment's own *.pages.dev URL. The custom domain,
      # including protocol and www redirects, is checked after the sitemap.
      - name: Check the deployment
        run: npm run test:seo:deployed -- "${{ steps.deploy.outputs.deployment-url }}"

      # The pages.dev deployment can succeed while the custom domain still
      # serves an older SPA fallback or an incorrect sitemap. Validate both.
      - name: Verify public-domain sitemap
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm run test:seo:deployed -- https://flutterpilot.com --sitemap-only; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::flutterpilot.com/sitemap.xml is not a valid sitemap. Inspect Cloudflare custom-domain routing and cached responses."
              exit 1
            fi
            echo "::warning::Public-domain sitemap check failed (attempt $attempt of 6); retrying after 10 seconds."
            sleep 10
          done

      # Every route, canonical, 404 and legacy redirect on the custom domain,
      # plus the http→https and www→apex hops (Cloudflare zone settings, not
      # this repository). Reported as a warning until it has passed once in
      # production; then drop continue-on-error to make it blocking.
      - name: Verify production routes and redirects
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if npm run test:seo:deployed -- https://flutterpilot.com --production; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::Production SEO checks failed on flutterpilot.com. Check the Cloudflare zone's Always Use HTTPS and www redirect settings, and the log above."
              exit 1
            fi
            echo "::warning::Production SEO checks failed (attempt $attempt of 3); retrying after 15 seconds."
            sleep 15
          done
